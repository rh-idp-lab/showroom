---
type: showroom

# Set the left column width to 50%
default_width: 50
# Persist the URL state so browser refresh doesn't reset the UI
persist_url_state: true

view_switcher:
  enabled: true
  default_mode: split

tabs:
  # Web terminal (SSH into the bastion)
  - name: Terminal
    path: '/tty1'
    port: '443'

  # OCP Console
  - name: OCP Console
    url: 'https://console-openshift-console.${DOMAIN}'
    external: true

  # Developer Hub (Red Hat Developer Hub / Backstage)
  - name: Developer Hub
    url: 'https://backstage-rhdh.${DOMAIN}'
    external: true

  # Cloud IDE
  - name: Dev Spaces
    url: 'https://devspaces.${DOMAIN}'
    external: true

  # Source control
  - name: GitLab
    url: 'https://gitlab-gitlab.${DOMAIN}'
    external: true

  # Cluster-level ArgoCD (GitOps foundation)
  - name: ArgoCD (Cluster)
    url: 'https://openshift-gitops-server-openshift-gitops.${DOMAIN}'
    external: true

  # Application-level ArgoCD (RHDH dedicated instance)
  - name: ArgoCD (Apps)
    url: 'https://rhdh-gitops-server-rhdh-gitops.${DOMAIN}'
    external: true
